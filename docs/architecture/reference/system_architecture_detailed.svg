<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1090" width="1600" height="1090" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7d"/>
    </marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a5ba6"/>
    </marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f3a5a" flood-opacity="0.12"/>
    </filter>
    <style>
      .t  { font-size: 22px; font-weight: 700; fill: #ffffff; }
      .h  { font-size: 19px; font-weight: 700; }
      .b  { font-size: 16px; fill: #2b3440; }
      .s  { font-size: 13.5px; fill: #6b7785; }
      .lb { font-size: 15px; font-weight: 700; }
      .ls { font-size: 13px; fill: #6b7785; }
      .line { stroke: #5b6b7d; stroke-width: 2.2; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="1090" fill="#f3f6f9"/>

  <!-- Header -->
  <rect x="0" y="0" width="1600" height="76" fill="#1f3a5a"/>
  <rect x="28" y="20" width="6" height="36" fill="#4fb3bf"/>
  <text x="50" y="49" class="t" style="font-size:28px">사회적 고립 위험신호 탐지 · 시스템 아키텍처</text>
  <text x="1572" y="49" text-anchor="end" style="font-size:14px;fill:#b9c9da">2026-10 현재 구현 기준</text>

  <!-- ===== Row 1 ===== -->
  <!-- DB1 input -->
  <g filter="url(#sh)">
    <rect x="40" y="104" width="440" height="200" rx="12" fill="#eaf1f8" stroke="#bfd2e6"/>
    <path d="M40,116 a12,12 0 0 1 12,-12 h416 a12,12 0 0 1 12,12 v34 h-440 z" fill="#3f6fa0"/>
  </g>
  <text x="62" y="134" class="h" fill="#fff">DB1 입력 · 분석 원천자료</text>
  <text x="62" y="182" class="b">빅콘테스트: 통신 유동인구 + 카드 소비</text>
  <text x="62" y="210" class="b">공공: 인구·가구·독거노인·상권·지역 맥락</text>
  <text x="62" y="238" class="b">preprocessing → 정제 · 검증 · 기준 통합</text>
  <text x="62" y="278" class="s">원본 ZIP/XLSX는 Git 제외 · 반기/월 단위 갱신</text>

  <!-- Dashboard -->
  <g filter="url(#sh)">
    <rect x="560" y="96" width="480" height="232" rx="12" fill="#ffffff" stroke="#bcdadf"/>
    <path d="M560,108 a12,12 0 0 1 12,-12 h456 a12,12 0 0 1 12,12 v52 h-480 z" fill="#2a7f8c"/>
  </g>
  <text x="582" y="118" style="font-size:12px;font-weight:700;fill:#cfeef2;letter-spacing:1px">WEB DASHBOARD</text>
  <text x="582" y="145" class="h" fill="#fff" style="font-size:21px">웹 대시보드 · React + Vite</text>
  <text x="582" y="188" class="b">종합 현황 · 지역 현황(지도) · 지역 분석</text>
  <text x="582" y="215" class="b">사업 매칭 검토 · 업무 기록 · 보고서 작성</text>
  <text x="582" y="242" class="b">분석 확인 → 근거 검토 → 사업 검토 → Word 보고서</text>
  <text x="582" y="269" class="b">관리자: 분석 자료 검사·반영 · AI 설정 · 활동 이력</text>
  <text x="582" y="306" class="s">지역 · 기준월 · 관찰 그룹을 챗봇과 공유</text>

  <!-- DB2 input -->
  <g filter="url(#sh)">
    <rect x="1120" y="104" width="440" height="200" rx="12" fill="#e9f5ef" stroke="#bfe0cf"/>
    <path d="M1120,116 a12,12 0 0 1 12,-12 h416 a12,12 0 0 1 12,12 v34 h-440 z" fill="#3d8f6e"/>
  </g>
  <text x="1142" y="134" class="h" fill="#fff">DB2 입력 · 복지자원</text>
  <text x="1142" y="182" class="b">지자체 복지사업 공공 API</text>
  <text x="1142" y="210" class="b">사업명 · 대상 · 이용 조건 · 담당 기관</text>
  <text x="1142" y="238" class="b">팀 정리 복지사업 · 강남구 정책 자료(JSON)</text>
  <text x="1142" y="278" class="s">chatbot/welfare/data/*.json → 보미 복지사업 안내</text>

  <!-- ===== API bar ===== -->
  <g filter="url(#sh)">
    <rect x="560" y="362" width="480" height="52" rx="10" fill="#33506e"/>
  </g>
  <text x="800" y="386" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#fff">Python HTTP API · webapp/server.py</text>
  <text x="800" y="405" text-anchor="middle" style="font-size:13px;fill:#c9d6e3">로그인 · 지역 접근 · 조회/저장 · 챗봇 스트림 · Word 생성</text>

  <!-- Dashboard <-> API -->
  <line x1="780" y1="330" x2="780" y2="358" class="line" marker-end="url(#ah)"/>
  <line x1="820" y1="358" x2="820" y2="330" class="line" marker-end="url(#ah)"/>

  <!-- ===== Row 2 ===== -->
  <!-- DB1 pipeline -->
  <g filter="url(#sh)">
    <rect x="40" y="360" width="440" height="330" rx="12" fill="#ffffff" stroke="#bfd2e6"/>
    <path d="M40,372 a12,12 0 0 1 12,-12 h416 a12,12 0 0 1 12,12 v34 h-440 z" fill="#3f6fa0"/>
  </g>
  <text x="62" y="390" class="h" fill="#fff">DB1 분석 실행기 · Python</text>
  <text x="62" y="436" class="lb" fill="#2f5e8f">Analysis1 · 지역 유형 (ML)</text>
  <text x="62" y="460" class="b">표준화 → PCA → KMeans 군집 (scikit-learn)</text>
  <text x="62" y="483" class="s">실루엣·ARI 안정성 확인 · 고정 모델 2025H2_elder_v2</text>
  <text x="62" y="520" class="lb" fill="#2f5e8f">Analysis2 · 변화 탐지 (통계)</text>
  <text x="62" y="544" class="b">공통 변화 대비 잔차 → 중앙값·MAD robust z</text>
  <text x="62" y="567" class="s">신규 · 연속 · 변화 후보 판정 (동 × 월)</text>
  <text x="62" y="604" class="lb" fill="#2f5e8f">Analysis3 · 소비 맥락 (기술 통계)</text>
  <text x="62" y="628" class="b">상권·카드 소비영역 과거 동기·전월 대비</text>
  <line x1="62" y1="648" x2="458" y2="648" stroke="#dbe5ef"/>
  <text x="62" y="673" class="s">작업 파일: SQLite(db1.sqlite) · CSV 전달본 · 딥러닝 미사용</text>

  <!-- Chatbot -->
  <g filter="url(#sh)">
    <rect x="560" y="450" width="480" height="240" rx="12" fill="#f4effa" stroke="#d3c4e8"/>
    <path d="M560,462 a12,12 0 0 1 12,-12 h456 a12,12 0 0 1 12,12 v34 h-480 z" fill="#7a5ba6"/>
  </g>
  <text x="582" y="480" class="h" fill="#fff">보미 챗봇 · AI Agent</text>
  <text x="582" y="524" class="lb" fill="#5d3f8a">가드레일 → 총괄 에이전트 담당 선택</text>
  <text x="582" y="548" class="s">개인정보 마스킹 · 업무 무관 질문 차단 · AI 또는 키워드 규칙</text>
  <g font-size="15" font-weight="700" fill="#5d3f8a">
    <rect x="582" y="562" width="104" height="34" rx="17" fill="#ffffff" stroke="#c8b6e2"/>
    <text x="634" y="584" text-anchor="middle">지역 분석</text>
    <rect x="694" y="562" width="104" height="34" rx="17" fill="#ffffff" stroke="#c8b6e2"/>
    <text x="746" y="584" text-anchor="middle">복지사업</text>
    <rect x="806" y="562" width="104" height="34" rx="17" fill="#ffffff" stroke="#c8b6e2"/>
    <text x="858" y="584" text-anchor="middle">보고서 작성</text>
    <rect x="918" y="562" width="100" height="34" rx="17" fill="#ffffff" stroke="#c8b6e2"/>
    <text x="968" y="584" text-anchor="middle">안내</text>
  </g>
  <text x="582" y="626" class="b">DB1 근거 · DB2/팀 자료를 출처와 함께 답변</text>
  <line x1="582" y1="644" x2="1018" y2="644" stroke="#e0d6ee"/>
  <text x="582" y="670" class="s">외부 AI(OpenAI·Claude·Gemini) 선택, 기본 꺼짐 → 자료 기반 답변</text>

  <!-- API <-> chatbot -->
  <line x1="780" y1="416" x2="780" y2="446" stroke="#7a5ba6" stroke-width="2.2" marker-end="url(#ahp)"/>
  <line x1="820" y1="446" x2="820" y2="416" stroke="#7a5ba6" stroke-width="2.2" marker-end="url(#ahp)"/>
  <text x="834" y="436" style="font-size:12.5px;fill:#7a5ba6">질문·화면 맥락 / 답변 스트림</text>

  <!-- DB2 collect -->
  <g filter="url(#sh)">
    <rect x="1120" y="360" width="440" height="330" rx="12" fill="#ffffff" stroke="#bfe0cf"/>
    <path d="M1120,372 a12,12 0 0 1 12,-12 h416 a12,12 0 0 1 12,12 v34 h-440 z" fill="#3d8f6e"/>
  </g>
  <text x="1142" y="390" class="h" fill="#fff">DB2 수집 · db.collect_welfare</text>
  <text x="1142" y="436" class="lb" fill="#2d7356">정기 수집</text>
  <text x="1142" y="460" class="b">공공 API 호출 → 응답 스냅샷 보관</text>
  <text x="1142" y="483" class="s">일별 API 사용량 · 수집 실행 이력 기록</text>
  <text x="1142" y="520" class="lb" fill="#2d7356">정제 · 갱신</text>
  <text x="1142" y="544" class="b">지역 · 대상 · 이용 조건 기준 정리</text>
  <text x="1142" y="567" class="s">지자체 복지사업 목록 갱신</text>
  <text x="1142" y="604" class="lb" fill="#2d7356">활용</text>
  <text x="1142" y="628" class="b">사업 매칭 검토 → 담당자 조건 검토</text>
  <line x1="1142" y1="648" x2="1538" y2="648" stroke="#d6ece0"/>
  <text x="1142" y="673" class="s">실제 기관 연락 · 자동 지원 승인은 미구현</text>

  <!-- ===== Arrows to PostgreSQL ===== -->
  <line x1="260" y1="306" x2="260" y2="356" class="line" marker-end="url(#ah)"/>
  <line x1="1340" y1="306" x2="1340" y2="356" class="line" marker-end="url(#ah)"/>

  <line x1="260" y1="692" x2="260" y2="788" class="line" marker-end="url(#ah)"/>
  <rect x="272" y="722" width="214" height="40" rx="6" fill="#f3f6f9"/>
  <text x="280" y="738" style="font-size:13.5px;font-weight:700;fill:#2f5e8f">scripts/import_db1.py</text>
  <text x="280" y="756" class="ls">검사 → 한 트랜잭션 반영</text>

  <line x1="1340" y1="692" x2="1340" y2="788" class="line" marker-end="url(#ah)"/>
  <text x="1354" y="744" style="font-size:13.5px;font-weight:700;fill:#2d7356">수집 결과 적재</text>

  <!-- API <-> PostgreSQL : gap lines -->
  <path d="M560,388 H520 V788" class="line" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <path d="M1040,388 H1080 V788" class="line" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="800" y="726" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#33506e">SQLAlchemy · psycopg2 (조회 · 업무 기록 저장 · 관리자 반영)</text>
  <text x="800" y="748" text-anchor="middle" class="ls">.env의 WELFIND_DATA_SOURCE = auto(DB 우선, 실패 시 CSV) · db · csv</text>

  <!-- ===== PostgreSQL ===== -->
  <g filter="url(#sh)">
    <rect x="40" y="792" width="1520" height="214" rx="14" fill="#ffffff" stroke="#9fb3c8" stroke-width="1.5"/>
  </g>
  <rect x="40" y="792" width="1520" height="44" rx="14" fill="#33506e"/>
  <rect x="40" y="820" width="1520" height="16" fill="#33506e"/>
  <text x="62" y="821" style="font-size:19px;font-weight:700;fill:#fff">공유 PostgreSQL · 오라클 클라우드 VM (팀 공용 서버)</text>
  <text x="1538" y="821" text-anchor="end" style="font-size:13.5px;fill:#c9d6e3">접속 정보는 .env · Git 제외</text>

  <!-- schema db1 -->
  <rect x="62" y="852" width="456" height="136" rx="10" fill="#eaf1f8" stroke="#bfd2e6"/>
  <text x="82" y="882" style="font-size:18px;font-weight:700;fill:#2f5e8f">db1 · 분석 데이터</text>
  <text x="82" y="910" class="b">analysis2_detections · 동별 판정(실행 버전 보존)</text>
  <text x="82" y="934" class="b">analysis1_region_typology · 지역 유형</text>
  <text x="82" y="958" class="b">group_flow_snapshots · 연령·성별 관찰 그룹</text>
  <text x="82" y="980" class="s">service_imports · 반영 이력</text>

  <!-- schema work -->
  <rect x="572" y="852" width="456" height="136" rx="10" fill="#eef1f4" stroke="#c8d2dc"/>
  <text x="592" y="882" style="font-size:18px;font-weight:700;fill:#33506e">work · 담당자 업무 기록</text>
  <text x="592" y="910" class="b">업무 단계: 분석 확인 → 근거 검토 → 사업 검토</text>
  <text x="592" y="934" class="b">검토·후속 조치 · 협업 기록 · 집단 검토 메모</text>
  <text x="592" y="958" class="b">Word 보고서 초안 · 최종 저장</text>
  <text x="592" y="980" class="s">처음 사용할 때 자동 생성 · 예전 PC별 SQLite 기록은 이전 스크립트로 옮김</text>

  <!-- schema db2 -->
  <rect x="1082" y="852" width="456" height="136" rx="10" fill="#e9f5ef" stroke="#bfe0cf"/>
  <text x="1102" y="882" style="font-size:18px;font-weight:700;fill:#2d7356">db2 · 복지 / 자원 데이터</text>
  <text x="1102" y="910" class="b">local_welfare_services · 지자체 복지사업</text>
  <text x="1102" y="934" class="b">welfare_api_snapshots · 수집 응답 보관</text>
  <text x="1102" y="958" class="b">welfare_collection_runs · 수집 실행 이력</text>
  <text x="1102" y="980" class="s">welfare_api_daily_usage · API 사용량</text>

  <!-- Footer principle -->
  <text x="800" y="1048" text-anchor="middle" style="font-size:15px;fill:#33506e;font-weight:700">지역 × 인구집단 × 시간 단위 신호 · 개인의 고립 여부는 판정하지 않음 · 수치는 Python 분석이 만들고 LLM은 근거를 설명</text>
  <text x="800" y="1072" text-anchor="middle" class="s">ML은 Analysis1 지역 유형 군집(KMeans)에만 사용 · 딥러닝·지도학습 예측 모델 없음 · 별도 에이전트 프레임워크 없이 Python 총괄 에이전트</text>
</svg>
