<!-- 로그인 / 앱 셸 / 오른쪽 챗봇 화면 구조 -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<div class="dashboard-root" id="dashboard-root">

<div id="login" class="login">
  <div class="lhero">
    <div style="position:relative">
      <h1>고립 위험이 커지는 동네를<br>매일 먼저 확인합니다</h1>
      <p>유동인구·소비 변화와 공공데이터를 합쳐 동별 사회적 고립 위험도를 계산하고, 방문·상담이 필요한 곳부터 좁혀 보는 담당자용 화면이에요.</p>
    </div>
    <div class="lmaps" id="lmaps"></div>
    <div class="lnote">시연용 화면 · 모든 수치는 샘플 데이터입니다</div>
  </div>
  <div class="lform">
    <form class="lcard" id="lform" autocomplete="off" novalidate>
      <h2>담당자 로그인</h2>
      <p class="sub">소속을 선택하고 계정으로 로그인하세요.</p>
      <label class="fld"><span>소속</span><select id="lorg"><option value="">소속 선택</option><option>강남구</option><option>춘천시</option><option>전체 관리자</option></select></label>
      <label class="fld"><span>아이디</span><input id="lid" type="text" autocomplete="username"></label>
      <label class="fld"><span>비밀번호</span><input id="lpw" type="password" autocomplete="current-password"></label>
      <p class="err" id="lerr" role="alert"></p>
      <button class="btn wide" type="submit">로그인</button>
      <div class="demo"><b>시연 계정</b> (누르면 입력돼요)
        <button type="button" data-demo="강남구|gangnam01|demo1234">강남구 · <code>gangnam01</code> / <code>demo1234</code></button>
        <button type="button" data-demo="춘천시|chuncheon01|demo1234">춘천시 · <code>chuncheon01</code> / <code>demo1234</code></button>
        <button type="button" data-demo="전체 관리자|admin|admin1234">전체 관리자 · <code>admin</code> / <code>admin1234</code></button>
      </div>
    </form>
  </div>
</div>

<div id="app" class="shell" hidden>
  <nav id="side" class="side" aria-label="주 메뉴"></nav>
  <div class="mainwrap"><header id="top" class="top"></header><main id="page" class="page"></main></div>
  <aside id="chat" class="chat" aria-label="고립예방 에이전트 챗봇">
    <header><h2>고립예방 에이전트<small>시연용 규칙 기반 응답</small></h2><button class="iconbtn" data-act="chatclose" aria-label="챗봇 닫기"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div class="ctx" id="ctx"></div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="chips">
      <button data-chip="가장 위험한 동은?">가장 위험한 동은?</button>
      <button data-chip="지난주보다 오른 동은?">오른 동은?</button>
      <button data-chip="선택한 동 위험 요인은?">선택한 동 요인</button>
    </div>
    <form class="cin" id="csend"><input id="cin" type="text" placeholder="예: 역삼동 상태 알려줘" aria-label="질문 입력"><button class="btn sm" style="height:40px" type="submit">보내기</button></form>
  </aside>
</div>
<div id="tip" class="tip" hidden></div>

</div>
