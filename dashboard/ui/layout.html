<!-- 로그인 / 앱 셸 / 오른쪽 챗봇 화면 구조 -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<div class="dashboard-root" id="dashboard-root" data-theme="light">

<div id="login" class="login">
  <div class="lhero">
    <div class="login-brand">WELFIND · 복지탐정</div>
    <div class="login-copy"><span class="login-eyebrow">지역의 작은 변화를 발견하는 파트너</span><h1>보미와 함께,<br>더 따뜻한 복지를<br>시작해요.</h1><p>보이지 않는 고립의 신호를 먼저 찾아<br>필요한 지원으로 연결합니다.</p></div>
    <div id="login-bomi" class="login-bomi"></div>
    <div class="login-bubble">안녕하세요, 보미예요!<br>이번 달 우리 동네를 함께 살펴볼까요?</div>
    <div class="lnote">발견하기 &nbsp; → &nbsp; 분석하기 &nbsp; → &nbsp; 연결하기</div>
  </div>
  <div class="lform">
    <form class="lcard" id="lform" autocomplete="off" novalidate>
      <span class="login-eyebrow">복지탐정 업무 공간</span><h2>반갑습니다, 담당자님</h2>
      <p class="sub">소속을 선택하고 계정으로 로그인하세요.</p>
      <label class="fld"><span>소속</span><select id="lorg"><option value="">소속 선택</option><option>강남구</option><option>춘천시</option><option>전체 관리자</option></select></label>
      <label class="fld"><span>아이디</span><input id="lid" type="text" autocomplete="username"></label>
      <label class="fld"><span>비밀번호</span><input id="lpw" type="password" autocomplete="current-password"></label>
      <p class="err" id="lerr" role="alert"></p>
      <button class="btn wide" type="submit">로그인</button>
      <div class="demo"><b>시연 계정</b> (누르면 입력돼요)
        <button type="button" data-demo="강남구|gangnam01|demo1234">강남구 · <code>gangnam01</code> / <code>demo1234</code></button>
        <button type="button" data-demo="춘천시|chuncheon01|demo1234">춘천시 · <code>chuncheon01</code> / <code>demo1234</code></button>
        <button type="button" data-demo="전체 관리자|admin|admin1234">전체 관리자 · <code>admin</code> / <code>admin1234</code></button>
      </div>
    </form>
  </div>
</div>

<div id="app" class="shell" hidden>
  <nav id="side" class="side" aria-label="주 메뉴"></nav>
  <div class="mainwrap"><header id="top" class="top"></header><main id="page" class="page"></main></div>
  <aside id="chat" class="chat" aria-label="복지탐정 AI 분석 도우미">
    <div id="assistant-user" class="assistant-user"></div>
    <div class="assistant-panel">
      <div class="assistant-hero"><div id="assistant-mascot"></div><div><h2>복지탐정 AI</h2><p>분석 근거를 확인하고<br>사업 연결과 보고를 진행하세요.</p></div><button class="iconbtn assistant-close" data-act="chatclose" aria-label="챗봇 닫기">×</button></div>
      <div class="assistant-shortcuts"><button data-view="analysis">지역 분석</button><button data-view="users">사업 매칭 검토</button><button data-view="reports">보고서 작성</button></div>
      <div class="ctx" id="ctx"></div>
      <div class="assistant-scroll"><div id="assistant-context"></div><div class="msgs" id="msgs" aria-live="polite"></div></div>
      <div id="mission-progress" class="mission-progress"></div>
      <form class="cin" id="csend"><input id="cin" type="text" placeholder="궁금한 내용을 입력하세요." aria-label="질문 입력"><button class="btn sm" type="submit" aria-label="질문 보내기">➤</button></form>
    </div>
  </aside>
</div>
<dialog id="region-dialog" class="region-dialog" aria-labelledby="region-dialog-title"><div id="region-dialog-content"></div></dialog>
<div id="tip" class="tip" hidden></div>

</div>
