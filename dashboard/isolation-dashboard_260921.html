<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고립예방 에이전트 · 지자체 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#EDF0F3;--surface:#FFFFFF;--surface2:#F5F7F9;--ink:#1B2733;--muted:#5B6A78;--line:#D8DEE4;--accent:#1F6F8B;--accent-ink:#FFFFFF;
 --side:#132A3E;--side-ink:#C3D1DE;--side-mute:#7E93A6;--side-on:#21455F;
 --b0:#CFE4DC;--b1:#F0D98C;--b2:#E7935B;--b3:#B02E4C;--l0:#1B2733;--l1:#1B2733;--l2:#1B2733;--l3:#FFFFFF;
 --up:#B02E4C;--down:#2A7F62;--halo:rgba(255,255,255,.75);--shadow:0 1px 2px rgba(19,42,62,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0E1620;--surface:#16212C;--surface2:#1C2937;--ink:#E5ECF2;--muted:#95A5B4;--line:#263543;--accent:#5FB3D0;--accent-ink:#0E1620;
 --side:#0A121A;--side-on:#173247;
 --b0:#2C5A4C;--b1:#8B7628;--b2:#B5622F;--b3:#D04A62;--l0:#E5ECF2;--l1:#FFFFFF;--l2:#FFFFFF;--l3:#FFFFFF;
 --up:#F0768B;--down:#6CCBA5;--halo:rgba(14,22,32,.7);--shadow:none}}
:root[data-theme="dark"]{
 --bg:#0E1620;--surface:#16212C;--surface2:#1C2937;--ink:#E5ECF2;--muted:#95A5B4;--line:#263543;--accent:#5FB3D0;--accent-ink:#0E1620;
 --side:#0A121A;--side-on:#173247;
 --b0:#2C5A4C;--b1:#8B7628;--b2:#B5622F;--b3:#D04A62;--l0:#E5ECF2;--l1:#FFFFFF;--l2:#FFFFFF;--l3:#FFFFFF;
 --up:#F0768B;--down:#6CCBA5;--halo:rgba(14,22,32,.7);--shadow:none}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.55 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg{display:block}

/* ---------- 로그인 ---------- */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.lhero{background:var(--side);color:#EAF1F7;padding:56px 56px 40px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;min-height:100%}
.lhero h1{font-size:36px;line-height:1.25;margin:0 0 14px;font-weight:700;letter-spacing:-.01em}
.lhero p{margin:0;max-width:30em;color:#B4C4D2;font-size:15px}
.lmaps{position:absolute;right:28px;bottom:64px;display:flex;gap:18px;align-items:flex-end;opacity:.9;pointer-events:none}
.lmaps svg{width:190px;height:auto}
.lmaps svg:last-child{width:240px}
.lmaps path{fill:rgba(255,255,255,.05);stroke:rgba(190,215,235,.35);stroke-width:1}
.lnote{position:relative;font-size:12.5px;color:#8FA5B8}
.lform{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.lcard{width:100%;max-width:380px}
.lcard h2{font-size:22px;margin:0 0 4px}
.lcard .sub{color:var(--muted);margin:0 0 22px}
.fld{display:block;margin-bottom:14px}
.fld span{display:block;font-size:13px;font-weight:500;margin-bottom:5px}
.fld input,.fld select{width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.btn{height:42px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:0 18px}
.btn.wide{width:100%;margin-top:6px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn.sm{height:32px;padding:0 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.err{min-height:20px;color:var(--up);font-size:13px;margin:8px 0 0}
.demo{margin-top:22px;border:1px dashed var(--line);border-radius:8px;padding:12px 14px;font-size:12.5px;color:var(--muted)}
.demo b{color:var(--ink);font-weight:600}
.demo button{display:block;width:100%;text-align:left;background:none;border:0;padding:3px 0;color:var(--muted)}
.demo button:hover{color:var(--accent)}
.demo code{font-family:inherit;color:var(--ink)}

/* ---------- 앱 셸 ---------- */
.shell{--sw:236px;height:100%;display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:var(--sw) minmax(0,1fr) 348px;overflow:hidden}
.shell.collapsed{--sw:64px}
.shell.nochat{grid-template-columns:var(--sw) minmax(0,1fr)}
@media (prefers-reduced-motion:no-preference){.shell{transition:grid-template-columns .18s ease}}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.sidehead{display:flex;align-items:center;gap:10px;height:56px;padding:0 14px;flex:none}
.iconbtn{width:36px;height:36px;border-radius:8px;border:0;background:transparent;color:inherit;display:grid;place-items:center;flex:none}
.side .iconbtn:hover{background:var(--side-on)}
.brand{font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;font-size:15px}
.shell.collapsed .brand,.shell.collapsed .glabel,.shell.collapsed .mlabel,.shell.collapsed .mtag{display:none}
.sidenav{flex:1;overflow:auto;padding:4px 10px 16px}
.glabel{font-size:12px;color:var(--side-mute);padding:14px 10px 6px;white-space:nowrap}
.shell.collapsed .glabel+.mi{margin-top:0}
.mi{display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--side-ink);text-align:left;white-space:nowrap}
.mi:hover{background:rgba(255,255,255,.06)}
.mi[aria-current="page"]{background:var(--side-on);color:#fff}
.mi svg{flex:none}
.mtag{margin-left:auto;font-size:11px;background:rgba(255,255,255,.12);border-radius:10px;padding:1px 8px;color:#DDE8F1}
.shell.collapsed .mi{justify-content:center;padding:0}
.sidefoot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:var(--side-mute);white-space:nowrap;overflow:hidden}
.shell.collapsed .sidefoot{display:none}

.mainwrap{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.top{display:flex;align-items:center;gap:14px;min-height:56px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.top h1{font-size:17px;margin:0;font-weight:700}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;background:var(--surface2);border:1px solid var(--line);font-size:12.5px;color:var(--muted);white-space:nowrap}
.pill.warn{color:var(--ink)}
.tabs{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:2px}
.tabs button{border:0;background:transparent;height:28px;padding:0 12px;border-radius:6px;font-size:13px;color:var(--muted)}
.tabs button[aria-pressed="true"],.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.who{font-size:13px;color:var(--muted);white-space:nowrap}
.page{flex:1;min-height:0;overflow:auto;padding:18px 20px 28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.card>header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 18px 0}
.card h2{font-size:15px;margin:0;font-weight:700}
.card .hint{font-size:12.5px;color:var(--muted)}
.cbody{padding:14px 18px 18px}

.ctrl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.period{display:inline-flex;align-items:center;gap:6px}
.period input,.period select{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 8px}
.period .iconbtn{width:32px;height:32px;border:1px solid var(--line);background:var(--surface)}
.grid{display:grid;gap:14px;margin-bottom:14px}
.g-map{grid-template-columns:minmax(0,1.9fr) minmax(270px,1fr)}
.g-low{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}

/* 밴드 막대(범례 겸 필터) */
.bands{display:flex;gap:6px;flex-wrap:wrap}
.bandbtn{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:15px;background:var(--surface);font-size:13px}
.bandbtn i{width:12px;height:12px;border-radius:3px;display:block}
.bandbtn b{font-weight:700}
.bandbtn[aria-pressed="true"]{border-color:var(--ink);background:var(--surface2)}

/* 지도 */
.mapbox{padding:8px 12px 8px;position:relative}
.mapbox svg{width:100%;height:auto;max-height:66vh;margin:0 auto}
.zoombtn{display:inline-flex;align-items:center;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:12.5px;white-space:nowrap}
.zoombtn[aria-pressed="true"]{border-color:var(--ink);background:var(--surface2)}
.u{vector-effect:non-scaling-stroke;stroke:var(--surface);stroke-width:1.4;stroke-linejoin:round;cursor:pointer}
.u.b0{fill:var(--b0)}.u.b1{fill:var(--b1)}.u.b2{fill:var(--b2)}.u.b3{fill:var(--b3)}
.u.dim{opacity:.22}
.u:hover{stroke:var(--ink);stroke-width:2}
.u.sel{stroke:var(--ink);stroke-width:3}
.ulab{font-size:13px;font-weight:600;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--halo);stroke-width:2.5px;stroke-linejoin:round}
.ulab.t0{fill:var(--l0)}.ulab.t1{fill:var(--l1)}.ulab.t2{fill:var(--l2)}.ulab.t3{fill:var(--l3);stroke:rgba(0,0,0,.25)}
.ulab.dim{opacity:.3}
.ulab .s{font-weight:400;font-size:12px}
.foot{font-size:12px;color:var(--muted);padding:0 18px 14px}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12.5px;padding:6px 10px;border-radius:6px;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.25)}

/* 상세 */
.dhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.dhead h3{font-size:20px;margin:0;font-weight:700}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-size:12px;font-weight:600}
.chip.b0{background:var(--b0);color:var(--l0)}.chip.b1{background:var(--b1);color:var(--l1)}.chip.b2{background:var(--b2);color:var(--l2)}.chip.b3{background:var(--b3);color:var(--l3)}
.big{font-size:40px;font-weight:700;line-height:1.1;margin:8px 0 2px;letter-spacing:-.02em}
.big small{font-size:14px;font-weight:400;color:var(--muted);letter-spacing:0}
.delta{font-size:13px}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}
.frow{display:grid;grid-template-columns:92px 1fr 44px;align-items:center;gap:10px;margin:9px 0;font-size:13px}
.frow .bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.frow .bar i{display:block;height:100%}
.frow .w{color:var(--muted);font-size:11.5px}
.frow .v{text-align:right;font-weight:600}
.note{margin:12px 0 0;padding:10px 12px;background:var(--surface2);border-radius:8px;font-size:13px}
.note p{margin:0 0 4px}.note p:last-child{margin:0}

/* 랭킹, 표 */
.rank{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:22px 1fr auto 64px;gap:8px;align-items:center;padding:8px 6px;border-radius:8px;cursor:pointer}
.rank li:hover,.rank li[aria-current="true"]{background:var(--surface2)}
.rank .n{color:var(--muted);font-size:12px;text-align:right}
.rank .sc{font-weight:700}
.rank .dl{text-align:right;font-size:12.5px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:12.5px;white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tblwrap{overflow-x:auto}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;min-width:180px;background:var(--surface2)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:block}
.chart{width:100%;height:auto}
.chart text{font-size:14px;fill:var(--muted)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .thl{stroke-width:1;stroke-dasharray:4 4}
.st{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-size:12px;background:var(--surface2);border:1px solid var(--line)}
.st.s0{border-color:var(--up);color:var(--up)}
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px}
.col h3{font-size:13.5px;margin:2px 4px 10px;display:flex;justify-content:space-between}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:13px}
.tk small{display:block;color:var(--muted);font-size:12px}
.sl{display:grid;grid-template-columns:110px 1fr 90px;gap:12px;align-items:center;margin:12px 0}
.sl input[type=range]{width:100%;accent-color:var(--accent)}
.empty{padding:26px;text-align:center;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.row select{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 8px}

/* 챗봇 */
.chat{display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line);min-width:0;min-height:0;height:100%}
.shell.nochat .chat{display:none}
.chat header{display:flex;align-items:center;gap:10px;padding:0 14px;min-height:56px;border-bottom:1px solid var(--line);flex:none}
.chat header h2{font-size:15px;margin:0;flex:1}
.chat header small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.ctx{padding:8px 14px;font-size:12px;color:var(--muted);background:var(--surface2);border-bottom:1px solid var(--line);flex:none}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:9px 12px;border-radius:12px;font-size:13.5px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.m.bot{background:var(--surface2);border:1px solid var(--line);border-top-left-radius:4px;align-self:flex-start}
.m.me{background:var(--accent);color:var(--accent-ink);border-top-right-radius:4px;align-self:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;flex:none}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:14px;height:28px;padding:0 10px;font-size:12.5px}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
.cin{display:flex;gap:8px;padding:10px 14px 14px;border-top:1px solid var(--line);flex:none}
.cin input{flex:1;height:40px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--surface);min-width:0}

@media (max-width:1179px){
 .shell,.shell.nochat{grid-template-columns:var(--sw) minmax(0,1fr)}
 .chat{display:none;position:fixed;z-index:40;top:0;right:0;bottom:0;width:min(380px,100%);box-shadow:-8px 0 30px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
 .chat.open{display:flex}
 .shell.nochat .chat.open{display:flex}
}
@media (max-width:1100px){.g-map,.g-low{grid-template-columns:minmax(0,1fr)}.cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
 .login{grid-template-columns:1fr}.lhero{padding:32px 24px;min-height:0;gap:26px}.lmaps{display:none}.lhero h1{font-size:28px}
 .page{padding:14px 12px 24px}.top{padding:8px 12px}.cols{grid-template-columns:1fr}
 .sl{grid-template-columns:90px 1fr 70px}
}

</style>
</head>
<body>
<div id="login" class="login">
  <div class="lhero">
    <div style="position:relative">
      <h1>고립 위험이 커지는 동네를<br>매일 먼저 확인합니다</h1>
      <p>유동인구·소비 변화와 공공데이터를 합쳐 동별 사회적 고립 위험도를 계산하고, 방문·상담이 필요한 곳부터 좁혀 보는 담당자용 화면이에요.</p>
    </div>
    <div class="lmaps" id="lmaps"></div>
    <div class="lnote">시연용 화면 · 모든 수치는 샘플 데이터입니다</div>
  </div>
  <div class="lform">
    <form class="lcard" id="lform" autocomplete="off" novalidate>
      <h2>담당자 로그인</h2>
      <p class="sub">소속을 선택하고 계정으로 로그인하세요.</p>
      <label class="fld"><span>소속</span><select id="lorg"><option value="">소속 선택</option><option>강남구</option><option>춘천시</option><option>전체 관리자</option></select></label>
      <label class="fld"><span>아이디</span><input id="lid" type="text" autocomplete="username"></label>
      <label class="fld"><span>비밀번호</span><input id="lpw" type="password" autocomplete="current-password"></label>
      <p class="err" id="lerr" role="alert"></p>
      <button class="btn wide" type="submit">로그인</button>
      <div class="demo"><b>시연 계정</b> (누르면 입력돼요)
        <button type="button" data-demo="강남구|gangnam01|demo1234">강남구 · <code>gangnam01</code> / <code>demo1234</code></button>
        <button type="button" data-demo="춘천시|chuncheon01|demo1234">춘천시 · <code>chuncheon01</code> / <code>demo1234</code></button>
        <button type="button" data-demo="전체 관리자|admin|admin1234">전체 관리자 · <code>admin</code> / <code>admin1234</code></button>
      </div>
    </form>
  </div>
</div>

<div id="app" class="shell" hidden>
  <nav id="side" class="side" aria-label="주 메뉴"></nav>
  <div class="mainwrap"><header id="top" class="top"></header><main id="page" class="page"></main></div>
  <aside id="chat" class="chat" aria-label="고립예방 에이전트 챗봇">
    <header><h2>고립예방 에이전트<small>시연용 규칙 기반 응답</small></h2><button class="iconbtn" data-act="chatclose" aria-label="챗봇 닫기"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div class="ctx" id="ctx"></div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="chips">
      <button data-chip="가장 위험한 동은?">가장 위험한 동은?</button>
      <button data-chip="지난주보다 오른 동은?">오른 동은?</button>
      <button data-chip="선택한 동 위험 요인은?">선택한 동 요인</button>
    </div>
    <form class="cin" id="csend"><input id="cin" type="text" placeholder="예: 역삼동 상태 알려줘" aria-label="질문 입력"><button class="btn sm" style="height:40px" type="submit">보내기</button></form>

  return PM[k]={solo:g?35+r()*50:15+r()*40,elder:g?15+r()*40:(rural?52+r()*30:22+r()*38),welfare:25+r()*50,

function fac(city,u,d){const key=city+'|'+u+'|'+d;let v=FCACHE.get(key);if(v)return v;const p=params(city,u);const dow=(d+4)%7;

  v=[flow,card,p.solo,p.elder,p.welfare];FCACHE.set(key,v);return v}

function monthF(city,u,m){const key=city+'|'+u+'|'+m;let v=MCACHE.get(key);if(v)return v;const [a,b]=monthRange(m);const s=[0,0,0,0,0];
  for(let d=a;d<=b;d++){const f=fac(city,u,d);for(let i=0;i<5;i++)s[i]+=f[i]}const n=b-a+1;v=s.map(x=>x/n);MCACHE.set(key,v);return v}

function zoomBox(){const g=GEO[S.city];const sm=g.units.filter(x=>x.a<3300);if(sm.length<6)return null;
 const xs=sm.map(x=>x.cx),ys=sm.map(x=>x.cy);const pad=34;let x0=Math.min(...xs)-pad,x1=Math.max(...xs)+pad,y0=Math.min(...ys)-pad,y1=Math.max(...ys)+pad;
 const ar=g.w/g.h;let w=x1-x0,h=y1-y0;if(w/h>ar){const nh=w/ar;y0-=(nh-h)/2;h=nh}else{const nw=h*ar;x0-=(nw-w)/2;w=nw}return {x:x0,y:y0,w,h,z:g.w/w}}
function mapSVG(rows){const g=GEO[S.city];const zb=S.zoom?zoomBox():null;const z=zb?zb.z:1;const vb=zb?`${zb.x.toFixed(1)} ${zb.y.toFixed(1)} ${zb.w.toFixed(1)} ${zb.h.toFixed(1)}`:`0 0 ${g.w} ${g.h}`;
 const sorted=rows.slice().sort((a,b)=>(a.n===S.sel)-(b.n===S.sel));
 let h=`<svg viewBox="${vb}" role="group" aria-label="${S.city} 행정동별 위험도 지도">`;
 sorted.forEach(r=>{const dim=S.band!==null&&r.b!==S.band;h+=`<path class="u b${r.b}${dim?' dim':''}${r.n===S.sel?' sel':''}" d="${r.d}" data-u="${r.n}" tabindex="0" role="button" aria-label="${r.n} 위험도 ${f1(r.s)} ${BN[r.b]}"/>`});
 rows.forEach(r=>{const dim=S.band!==null&&r.b!==S.band;const A=r.a*z*z;if(A<3300)return;if(zb&&(r.cx<zb.x||r.cx>zb.x+zb.w||r.cy<zb.y||r.cy>zb.y+zb.h))return;
  h+=`<text class="ulab t${r.b}${dim?' dim':''}" x="${r.cx}" y="${r.cy}" style="font-size:${(13/z).toFixed(2)}px;stroke-width:${(2.5/z).toFixed(2)}px">${r.n}${A>=6500?`<tspan class="s" x="${r.cx}" dy="${(12/z).toFixed(1)}" style="font-size:${(12/z).toFixed(2)}px">${Math.round(r.s)}</tspan>`:''}</text>`});
 return h+`</svg>`}
function bandBar(rows){const c=[0,0,0,0];rows.forEach(r=>c[r.b]++);

function detailHTML(r){if(!r)return '<div class="empty">지도에서 동을 선택하세요.</div>';
 const tot=S.W.reduce((a,b)=>a+b,0);
 let h=`<div class="dhead"><h3>${r.n}</h3><span class="chip b${r.b}">${BN[r.b]}</span></div><div class="big num">${f1(r.s)}<small> / 100</small></div><div class="delta num">${perLabel()} 대비 ${dl(r.delta)}</div><div style="margin-top:12px">`;
 r.f.forEach((v,i)=>{h+=`<div class="frow"><span>${FS[i]}<br><span class="w">가중 ${Math.round(S.W[i]/tot*100)}%</span></span><div class="bar"><i style="width:${v}%;background:${FC[i]}"></i></div><span class="v num">${Math.round(v)}</span></div>`});
 h+=`</div><div class="note">${hints(r).map(t=>`<p>${t}</p>`).join('')}</div><div style="margin-top:12px"><button class="btn ghost sm" data-goto-users="${r.n}">이 동의 대상자 보기</button></div>`;return h}
function chartSVG(series,labels,extra){
 const W=600,H=220,L=34,R=12,T=12,B=26;let all=series.flatMap(s=>s.v);let mn=Math.floor(Math.min(...all,TH[0])/10)*10-0,mx=Math.ceil(Math.max(...all,TH[2]+2)/10)*10;if(mx-mn<30)mn=mx-30;
 const X=i=>L+(labels.length===1?0:i*(W-L-R)/(labels.length-1)),Y=v=>T+(mx-v)*(H-T-B)/(mx-mn);
 let h=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${extra}">`;
 for(let v=mn;v<=mx;v+=10)h+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
 [[TH[1],'--b2','위험'],[TH[2],'--b3','심각']].forEach(t=>{if(t[0]>mn&&t[0]<mx)h+=`<line class="thl" x1="${L}" x2="${W-R}" y1="${Y(t[0])}" y2="${Y(t[0])}" stroke="var(${t[1]})"/><text x="${W-R}" y="${Y(t[0])-3}" text-anchor="end" style="fill:var(${t[1]})">${t[2]} ${t[0]}↑</text>`});
 const step=Math.ceil(labels.length/6);labels.forEach((lb,i)=>{if(i%step===0||i===labels.length-1)h+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${lb}</text>`});
 series.forEach(s=>{h+=`<path d="M${s.v.map((v,i)=>`${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join('L')}" fill="none" stroke="${s.c}" stroke-width="${s.w}" stroke-linejoin="round" stroke-linecap="round"/>`;
  const li=s.v.length-1;h+=`<circle cx="${X(li)}" cy="${Y(s.v[li])}" r="${s.w+1.5}" fill="${s.c}"><title>${s.name} ${f1(s.v[li])}</title></circle>`});
 return h+`</svg>`}
function trendCard(rows){const city=S.city,units=GEO[city].units.map(x=>x.n);let labels=[],keys=[];
 if(S.mode==='day'){const e=toD(S.date);for(let i=29;i>=0;i--){keys.push(fmtD(e-i));}labels=keys.map(k=>+k.slice(5,7)+'/'+ +k.slice(8))}
 else{keys=MONTHS.slice();labels=keys.map(k=>+k.slice(5)+'월')}

 const series=[{name:`${city} 평균`,c:'#7D8FA0',w:2,v:avg}];
 if(S.sel)series.push({name:S.sel,c:'var(--accent)',w:3,v:keys.map(k=>scoreAt(city,S.sel,S.mode,k,S.W))});

const SUR=['김','이','박','최','정','강','조','윤','장','임','한','오'],AGES=['20대','30대','60대','70대','70대','80대 이상'],STAT=['미배정','방문 예정','상담 완료','모니터링'];
function people(city){if(PEOPLE[city])return PEOPLE[city];const r=mul(hstr(city+'p'));const units=GEO[city].units.map(x=>{const f=fac(city,x.n,END);return {n:x.n,s:scoreOf(f,DEFW),f}});
 const arr=[];for(let i=0;i<32;i++){let t=r()*units.reduce((a,u)=>a+u.s**3,0),u=units[0];for(const x of units){t-=x.s**3;if(t<=0){u=x;break}}
  const sc=cl(u.s+ (r()*2-1)*10+6);const why=u.f.map((v,k)=>[k,v]).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>['활동량 감소','카드 결제 감소','독거 가구','고령','복지 미연계'][x[0]]);
  const age=AGES[Math.floor(r()*AGES.length)];arr.push({name:SUR[Math.floor(r()*SUR.length)]+'○○',age,u:u.n,s:sc,why,st:STAT[Math.min(3,Math.floor(r()*r()*4.2))],last:fmtD(END-Math.floor(r()*40))})}
 return PEOPLE[city]=arr.sort((a,b)=>b.s-a.s)}

 return `<section class="card"><header><h2>위험도 가중치</h2><button class="btn ghost sm" data-act="resetW">기본값으로</button></header><div class="cbody"><p class="hint" style="margin-top:0">위험도 = 5개 요인 값(0~100)의 가중 평균이에요. 값을 바꾸면 종합 현황의 지도·순위·추이에 바로 반영돼요.</p>
 ${FS.map((n,i)=>`<div class="sl"><label for="w${i}"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${FC[i]};margin-right:6px"></span>${n}</label><input id="w${i}" type="range" min="0" max="40" step="1" value="${S.W[i]}" data-w="${i}"><span class="num" id="wv${i}">${S.W[i]} (${Math.round(S.W[i]/tot*100)}%)</span></div>`).join('')}
 <div class="note"><p><b>위험 단계 기준</b> (위험도 점수)</p><p>양호 ${TH[0]} 미만 · 주의 ${TH[0]}~${TH[1]-0.1} · 위험 ${TH[1]}~${TH[2]-0.1} · 심각 ${TH[2]} 이상</p></div></div></section>`}
function viewLogs(){if(!S.user.admin)return '<div class="empty">관리자만 볼 수 있어요.</div>';
 const tabs=['전체','접속','조회','질의','설정'];const list=LOGS.filter(l=>S.logTab==='전체'||l.type===S.logTab);
 return `<section class="card"><header><h2>접속·조회 로그</h2><span class="hint">모든 지자체 담당자의 이력 · 최신순</span></header><div class="cbody"><div class="row"><div class="tabs" role="group" aria-label="로그 종류">${tabs.map(t=>`<button data-logtab="${t}" aria-pressed="${S.logTab===t}">${t}</button>`).join('')}</div><span class="hint">${list.length}건</span></div>
 <div class="tblwrap"><table class="tbl"><thead><tr><th>일시</th><th>계정</th><th>소속</th><th>구분</th><th>내용</th><th>결과</th></tr></thead><tbody>${list.map(l=>`<tr><td class="num">${l.t}</td><td>${esc(l.id)}</td><td>${esc(l.org)}</td><td>${l.type}</td><td>${esc(l.detail)}</td><td>${l.ok?'성공':'<span class="up">실패</span>'}</td></tr>`).join('')}</tbody></table></div></div></section>`}
function renderPage(){const v={dash:viewDash,analysis:viewAnalysis,users:viewUsers,actions:viewActions,data:viewData,settings:viewSettings,logs:viewLogs}[S.view];$('#page').innerHTML=v();updateCtx()}
function render(){renderSide();renderTop();renderPage();$('#app').classList.toggle('nochat',!S.chat);$('#chat').classList.toggle('open',S.chat)}
function updateCtx(){$('#ctx').textContent=`보는 중: ${S.city} · ${modeLabel()} · ${periodLabel()}${S.view==='dash'&&S.sel?' · '+S.sel:''}`}

/* ---- 챗봇 (시연용 규칙 기반) ---- */
function addMsg(t,who){const m=document.createElement('div');m.className='m '+who;m.textContent=t;const b=$('#msgs');b.appendChild(m);b.scrollTop=b.scrollHeight}
function answer(q){const rows=snap().sort((a,b)=>b.s-a.s);const t=q.replace(/\s/g,'');const per=perLabel();
 const desc=r=>`${r.n}: 위험도 ${f1(r.s)}(${BN[r.b]}), ${per}보다 ${dtxt(r.delta)}. 주요 요인은 ${topFac(r).join(', ')}이에요.`;
 const base=n=>/[0-9]동$|본동$/.test(n)?n.replace(/(본|[0-9])동$/,''):n;
 const hit=rows.filter(r=>base(r.n).length>=2&&t.includes(base(r.n)));
 if(hit.length){return hit.slice(0,3).map(r=>desc(r)+'\n→ '+hints(r)[0]).join('\n\n')}
 if(/요인|이유|왜|원인/.test(t)){const r=rows.find(x=>x.n===S.sel);if(!r)return '지도에서 동을 먼저 선택해 주세요.';return desc(r)+'\n→ '+hints(r).join('\n→ ')}
 if(/상승|오른|급|증가|악화/.test(t)){const l=rows.slice().sort((a,b)=>b.delta-a.delta).slice(0,3);return `${per}보다 가장 많이 오른 곳이에요.\n`+l.map(r=>`· ${r.n} ${dtxt(r.delta)} (현재 ${f1(r.s)})`).join('\n')}
 if(/위험|순위|높은|심각|우선|방문|어디/.test(t)){const l=rows.slice(0,3);return `${S.city} ${periodLabel()} 기준 우선 확인할 곳이에요.\n`+l.map((r,i)=>`${i+1}. ${desc(r)}`).join('\n')}
 if(/로그|이력/.test(t))return S.user.admin?'좌측 메뉴의 "접속·조회 로그"에서 전체 이력을 볼 수 있어요.':'로그는 전체 관리자 계정에서만 볼 수 있어요.';
 return '이렇게 물어볼 수 있어요.\n· 가장 위험한 동은?\n· 지난주보다 오른 동은?\n· 선택한 동 위험 요인은?\n· 역삼동 상태 알려줘\n\n(시연용 응답이라 정해진 질문 유형만 이해해요.)'}
function send(q){q=q.trim();if(!q)return;addMsg(q,'me');log('질의',q);const inp=$('#cin');inp.value='';setTimeout(()=>{addMsg(answer(q),'bot');},380)}

/* ---- 로그인/이벤트 ---- */
function login(e){e.preventDefault();const org=$('#lorg').value,id=$('#lid').value.trim(),pw=$('#lpw').value;const err=$('#lerr');
 if(!org){err.textContent='소속을 선택해 주세요.';return}
 const a=ACC.find(x=>x.id===id&&x.pw===pw);
 if(!a){err.textContent='아이디 또는 비밀번호가 맞지 않아요.';log('접속','로그인 실패 (아이디/비밀번호 불일치)',false,{id:id||'-',org});return}
 if(a.org!==org){err.textContent='선택한 소속과 계정이 맞지 않아요.';log('접속','로그인 실패 (소속 불일치)',false,{id:a.id,org});return}
 S.user=a;S.city=a.admin?'강남구':a.org;S.view='dash';S.sel=null;log('접속','로그인');
 $('#login').hidden=true;$('#app').hidden=false;render();if(!$('#msgs').children.length)addMsg(`${a.name}님, 안녕하세요. 동별 위험도, 상승 지역, 위험 요인을 물어보세요.`,'bot')}
function logout(){log('접속','로그아웃');S.user=null;$('#app').hidden=true;$('#login').hidden=false;$('#lpw').value='';$('#lerr').textContent='';$('#msgs').innerHTML=''}
function pick(u){S.sel=u;log('조회',`${S.city} ${u} 상세`);renderPage()}
document.addEventListener('click',e=>{const t=e.target;let el;
 if(el=t.closest('[data-demo]')){const [o,i,p]=el.dataset.demo.split('|');$('#lorg').value=o;$('#lid').value=i;$('#lpw').value=p;return}
 if(!S.user)return;
 if(el=t.closest('[data-view]')){if(el.dataset.view==='logs'&&!S.user.admin)return;S.view=el.dataset.view;log('조회',TITLES[S.view]+' 화면');render();return}
 if(el=t.closest('[data-act]')){const a=el.dataset.act;
  if(a==='side'){S.side=!S.side;renderSide();return}
  if(a==='chat'){S.chat=!S.chat;$('#app').classList.toggle('nochat',!S.chat);$('#chat').classList.toggle('open',S.chat);renderTop();return}
  if(a==='chatclose'){S.chat=false;$('#app').classList.add('nochat');$('#chat').classList.remove('open');renderTop();return}
  if(a==='logout'){logout();return}
  if(a==='zoom'){S.zoom=!S.zoom;renderPage();return}
  if(a==='resetW'){S.W=DEFW.slice();log('설정','위험도 가중치 초기화');renderPage();return}}
 if(el=t.closest('[data-city]')){S.city=el.dataset.city;S.sel=null;S.band=null;S.zoom=false;S.uunit='전체';log('조회',`${S.city}로 전환`);render();return}
 if(el=t.closest('[data-mode]')){S.mode=el.dataset.mode;log('조회',`${S.city} · ${modeLabel()} 단위 전환`);renderPage();return}
 if(el=t.closest('[data-step]')){const d=Math.min(END,toD(S.date)+ +el.dataset.step);S.date=fmtD(d);renderPage();return}
 if(el=t.closest('[data-band]')){const b=+el.dataset.band;S.band=S.band===b?null:b;renderPage();return}
 if(el=t.closest('[data-u]')){pick(el.dataset.u);return}
 if(el=t.closest('[data-goto-users]')){S.uunit=el.dataset.gotoUsers;S.ustat='전체';S.view='users';render();return}
 if(el=t.closest('[data-ustat]')){S.ustat=el.dataset.ustat;renderPage();return}
 if(el=t.closest('[data-logtab]')){S.logTab=el.dataset.logtab;renderPage();return}
 if(el=t.closest('[data-chip]')){send(el.dataset.chip);return}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-u]')){e.preventDefault();pick(e.target.dataset.u)}});
document.addEventListener('change',e=>{const t=e.target;if(!S.user)return;
 if(t.matches('[data-date]')){let d=toD(t.value);if(isNaN(d))return;d=Math.max(END-365,Math.min(END,d));S.date=fmtD(d);log('조회',`${S.city} · 일 · ${S.date}`);renderPage()}
 else if(t.matches('[data-month]')){S.month=t.value;log('조회',`${S.city} · 월 · ${S.month}`);renderPage()}
 else if(t.matches('[data-uunit]')){S.uunit=t.value;renderPage()}});
document.addEventListener('input',e=>{const t=e.target;if(S.user&&t.matches('[data-w]')){S.W[+t.dataset.w]=+t.value;if(S.W.reduce((a,b)=>a+b,0)===0){S.W[+t.dataset.w]=1;t.value=1}
 const tot=S.W.reduce((a,b)=>a+b,0);S.W.forEach((w,i)=>{$('#wv'+i).textContent=`${w} (${Math.round(w/tot*100)}%)`});clearTimeout(window._wt);window._wt=setTimeout(()=>log('설정','위험도 가중치 변경: '+S.W.join('/')),700)}});
/* 지도 툴팁 */
const tip=$('#tip');
document.addEventListener('mousemove',e=>{const el=e.target.closest&&e.target.closest('path[data-u]');if(!el||!S.user){tip.hidden=true;return}
 const r=snap().find(x=>x.n===el.dataset.u);if(!r){tip.hidden=true;return}
 tip.textContent=`${r.n} · ${BN[r.b]} ${f1(r.s)} (${perLabel()} 대비 ${dtxt(r.delta)})`;tip.hidden=false;
 const w=tip.offsetWidth;tip.style.left=Math.min(innerWidth-w-8,e.clientX+14)+'px';tip.style.top=(e.clientY+16)+'px'});
document.addEventListener('mouseleave',()=>{tip.hidden=true});
$('#lform').addEventListener('submit',login);
$('#csend').addEventListener('submit',e=>{e.preventDefault();send($('#cin').value)});

/* 로그인 화면 배경: 실제 경계 실루엣 */
$('#lmaps').innerHTML=Object.keys(GEO).map(c=>{const g=GEO[c];return `<svg viewBox="0 0 ${g.w} ${g.h}" aria-hidden="true">${g.units.map(u=>`<path d="${u.d}"/>`).join('')}</svg>`}).join('');

</script>
</body>
</html>
